// Pre-seeded connections for CloudBeaver (dockerized DBeaver).
// Passwords are deliberately NOT stored here - this file is committed.
// CloudBeaver prompts on first connect; read the value from
// infra/secrets/mysql_app_password.txt (app user) or mysql_root_password.txt (root).
{
  "folders": {
    "hotel-booking": {
      "description": "Hotel Booking System"
    }
  },
  "connections": {
    "hbs-mysql-app": {
      "provider": "mysql",
      "driver": "mysql8",
      "name": "HBS MySQL (app user)",
      "description": "hbs_app - DML only, no DDL",
      "folder": "hotel-booking",
      "save-password": false,
      "configuration": {
        "host": "mysql",
        "port": "3306",
        "database": "hotel_booking",
        "url": "jdbc:mysql://mysql:3306/hotel_booking",
        "type": "dev",
        "auth-model": "native",
        "user": "hbs_app",
        "provider-properties": {
          "@dbeaver-show-non-default-db@": "false"
        }
      }
    },
    "hbs-mysql-root": {
      "provider": "mysql",
      "driver": "mysql8",
      "name": "HBS MySQL (root)",
      "description": "root - migrations and admin only",
      "folder": "hotel-booking",
      "save-password": false,
      "configuration": {
        "host": "mysql",
        "port": "3306",
        "database": "hotel_booking",
        "url": "jdbc:mysql://mysql:3306/hotel_booking",
        "type": "dev",
        "auth-model": "native",
        "user": "root"
      }
    }
  }
}
