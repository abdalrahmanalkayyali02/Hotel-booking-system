# Hotel Booking System - Redis (cache + booking locks + session store)
bind 0.0.0.0
protected-mode yes
port 6379
timeout 300
tcp-keepalive 300

# auth injected at startup from /run/secrets/redis_password (see compose command)

# persistence: AOF for lock/session durability
appendonly yes
appendfsync everysec
dir /data
save 900 1
save 300 10
save 60 10000

maxmemory 384mb
maxmemory-policy allkeys-lru

# harden: block destructive cmds
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""

notify-keyspace-events Ex
loglevel notice
